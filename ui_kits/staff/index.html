<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filo · Staff App</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; height: 100%; background: #060606; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame {
    width: 390px; height: 844px; flex-shrink: 0;
    background: var(--filo-black);
    border-radius: 48px;
    border: 8px solid #1a1a1a;
    box-shadow: 0 40px 120px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.06);
    overflow: hidden;
    transform-origin: center center;
    font-family: var(--font-sans);
    color: var(--fg-1);
    position: relative;
  }
  /* iPhone notch */
  #notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; background: #1a1a1a;
    border-radius: 0 0 22px 22px; z-index: 100;
  }
  #root { width: 100%; height: 100%; overflow: hidden; }
  button { font-family: var(--font-sans); color: inherit; }
  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <div id="notch"></div>
    <div id="root"></div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
  function fit() {
    const pad = 48;
    const s = Math.min((window.innerWidth - pad) / 390, (window.innerHeight - pad) / 844);
    document.getElementById('frame').style.transform = 'scale(' + Math.min(s, 1) + ')';
  }
  window.addEventListener('resize', fit); fit();
</script>

<script type="text/babel" src="staff-app.jsx"></script>
<script type="text/babel" data-presets="react">
  const wait = setInterval(() => {
    if (window.StaffApp) {
      clearInterval(wait);
      ReactDOM.createRoot(document.getElementById('root')).render(<StaffApp />);
    }
  }, 40);
</script>
</body>
</html>
