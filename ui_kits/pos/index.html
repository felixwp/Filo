<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filo · POS UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; height: 100%; background: #060606; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame {
    width: 1194px; height: 834px; flex-shrink: 0;
    background: var(--filo-black);
    border-radius: 26px;
    border: 0.5px solid rgba(245,239,228,0.10);
    box-shadow: 0 40px 120px rgba(0,0,0,0.7);
    overflow: hidden;
    transform-origin: center center;
    font-family: var(--font-sans);
    color: var(--fg-1);
  }
  #root { width: 100%; height: 100%; }
  button { font-family: var(--font-sans); color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(245,239,228,0.14); border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="root"></div></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" ></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" ></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" ></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
  // Scale the fixed iPad frame to fit the viewport (letterbox).
  function fit() {
    const pad = 32;
    const s = Math.min((window.innerWidth - pad) / 1194, (window.innerHeight - pad) / 834);
    document.getElementById('frame').style.transform = 'scale(' + Math.min(s, 1) + ')';
  }
  window.addEventListener('resize', fit); fit();
</script>

<script src="data.js"></script>
<script type="text/babel" src="primitives.jsx?v=2"></script>
<script type="text/babel" src="Login.jsx?v=2"></script>
<script type="text/babel" src="FloorPlan.jsx?v=2"></script>
<script type="text/babel" src="TableOrder.jsx?v=2"></script>
<script type="text/babel" src="KDS.jsx?v=2"></script>
<script type="text/babel" src="Dashboard.jsx?v=2"></script>
<script type="text/babel" src="Guide.jsx?v=2"></script>
<script type="text/babel" src="Payment.jsx?v=2"></script>
<script type="text/babel" src="App.jsx?v=2"></script>
<script type="text/babel" data-presets="react">
  const wait = setInterval(() => {
    if (window.App && window.Login && window.FloorPlan && window.TableOrder && window.KDS && window.Dashboard && window.Payment && window.Guide) {
      clearInterval(wait);
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
  }, 40);
</script>
</body>
</html>
