<!-- @dsCard group="Spacing" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:16px;">Corner radii — rounding keeps the dark palette warm</div>
  <div class="row" style="gap:22px;align-items:flex-end;">
    <div class="col" style="align-items:center;gap:8px;"><div style="width:96px;height:64px;background:var(--filo-surface);border:0.5px solid var(--border-cream);border-radius:10px;"></div><span class="mono-tag">10 · buttons</span></div>
    <div class="col" style="align-items:center;gap:8px;"><div style="width:96px;height:64px;background:var(--filo-surface);border:0.5px solid var(--border-cream);border-radius:12px;"></div><span class="mono-tag">12 · panels</span></div>
    <div class="col" style="align-items:center;gap:8px;"><div style="width:96px;height:64px;background:var(--filo-surface);border:0.5px solid var(--border-cream);border-radius:14px;"></div><span class="mono-tag">14 · cards</span></div>
    <div class="col" style="align-items:center;gap:8px;"><div style="width:96px;height:64px;background:var(--filo-surface);border:0.5px solid var(--border-cream);border-radius:16px;"></div><span class="mono-tag">16 · table tiles</span></div>
    <div class="col" style="align-items:center;gap:8px;"><div style="width:64px;height:64px;background:var(--filo-surface);border:0.5px solid var(--border-cream);border-radius:999px;"></div><span class="mono-tag">999 · pills</span></div>
  </div>
</div></body></html>
