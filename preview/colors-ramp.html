<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Extended ramp · calibrated from the core five</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
    <div class="col"><div style="height:64px;background:#0A3A1F;border-radius:10px;"></div><div class="mono-tag" style="margin-top:8px;color:var(--fg-2)">green-deep</div><div class="mono-tag">#0A3A1F · pressed</div></div>
    <div class="col"><div style="height:64px;background:#0D4A28;border-radius:10px;"></div><div class="mono-tag" style="margin-top:8px;color:var(--fg-2)">green</div><div class="mono-tag">#0D4A28 · base</div></div>
    <div class="col"><div style="height:64px;background:#14633A;border-radius:10px;"></div><div class="mono-tag" style="margin-top:8px;color:var(--fg-2)">green-bright</div><div class="mono-tag">#14633A · hover</div></div>
    <div class="col"><div style="height:64px;background:#E0AB3A;border-radius:10px;"></div><div class="mono-tag" style="margin-top:8px;color:var(--fg-2)">gold-soft</div><div class="mono-tag">#E0AB3A · hover</div></div>
    <div class="col"><div style="height:64px;background:#1C1C1C;border:0.5px solid var(--border-cream);border-radius:10px;"></div><div class="mono-tag" style="margin-top:8px;color:var(--fg-2)">surface</div><div class="mono-tag">#1C1C1C</div></div>
    <div class="col"><div style="height:64px;background:#262626;border-radius:10px;"></div><div class="mono-tag" style="margin-top:8px;color:var(--fg-2)">surface-2</div><div class="mono-tag">#262626 · hover</div></div>
    <div class="col"><div style="height:64px;background:#303030;border-radius:10px;"></div><div class="mono-tag" style="margin-top:8px;color:var(--fg-2)">surface-3</div><div class="mono-tag">#303030 · inputs</div></div>
    <div class="col"><div style="height:64px;background:#9E3B2E;border-radius:10px;"></div><div class="mono-tag" style="margin-top:8px;color:var(--fg-2)">red</div><div class="mono-tag">#9E3B2E · destructive</div></div>
  </div>
</div></body></html>
