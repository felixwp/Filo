<!-- @dsCard group="Type" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card row" style="gap:40px;align-items:center;">
  <div class="col" style="align-items:center;gap:4px;">
    <span class="filo-wordmark" style="font-size:40px;position:relative;letter-spacing:0.1em;">FIL<span>O</span>
      <span style="position:absolute;left:0;bottom:-6px;width:62%;height:3px;background:var(--filo-green);border-radius:2px;"></span>
    </span>
    <span style="font:var(--text-body);color:var(--fg-3);margin-top:14px;">A good shift.</span>
  </div>
  <div class="col" style="gap:8px;border-left:0.5px solid var(--border-cream);padding-left:36px;">
    <div class="mono-tag" style="color:var(--fg-2)">Wordmark — logotype only</div>
    <div class="mono-tag">Instrument Sans Bold</div>
    <div class="mono-tag">Uppercase · tracking +0.10em</div>
    <div class="mono-tag">Green underline under "FIL"</div>
    <div class="mono-tag" style="color:var(--fg-4)">Never used for body copy</div>
  </div>
</div></body></html>
