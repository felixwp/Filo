<!-- @dsCard group="Brand" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card row" style="gap:50px;align-items:center;justify-content:center;">
  <div class="col" style="align-items:center;gap:18px;">
    <img src="../assets/filo-symbol-green.svg" height="92" alt="Filo symbol exploration">
    <div class="col" style="align-items:center;gap:8px;">
      <span class="filo-wordmark" style="font-size:32px;position:relative;letter-spacing:0.1em;">FILO
        <span style="position:absolute;left:0;bottom:-6px;width:62%;height:3px;background:var(--filo-green);border-radius:2px;"></span>
      </span>
      <span style="font:var(--text-label);color:var(--fg-3);margin-top:10px;">A good shift.</span>
    </div>
  </div>
  <div class="col" style="gap:6px;border-left:0.5px solid var(--border-cream);padding-left:34px;max-width:200px;">
    <div class="mono-tag" style="color:var(--fg-2)">Symbol exploration</div>
    <div class="mono-tag">Layered arcs — "filo" thin layers + the rising curve of a good shift</div>
    <div class="mono-tag" style="color:var(--fg-4);margin-top:6px;">Keeps green circle + gold dot. The literal "F" mark remains the official lockup — see Brand.</div>
  </div>
</div></body></html>
