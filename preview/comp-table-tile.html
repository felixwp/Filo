<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:16px;">Table tile · floor plan · status = border glow</div>
  <div class="row" style="gap:16px;">
    <!-- occupied + birthday -->
    <div style="position:relative;width:150px;height:118px;background:var(--filo-surface);border-radius:16px;padding:14px;box-shadow:0 0 0 1.5px rgba(20,99,58,0.85),0 0 18px rgba(20,99,58,0.35);">
      <div style="position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:999px;background:var(--filo-gold);box-shadow:0 0 8px rgba(201,146,30,0.7);"></div>
      <div style="font:var(--text-h1);text-align:left;">12</div>
      <div style="font:var(--text-label);color:var(--fg-3);margin-top:2px;">2 PAX</div>
      <div style="position:absolute;left:14px;bottom:12px;"><span class="filo-pill" style="color:#5cc88a;">Occupied</span></div>
      <div style="position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--fg-3);">0:42</div>
    </div>
    <!-- awaiting payment -->
    <div style="position:relative;width:150px;height:118px;background:var(--filo-surface);border-radius:16px;padding:14px;box-shadow:0 0 0 1.5px rgba(201,146,30,0.9),0 0 18px rgba(201,146,30,0.4);">
      <div style="font:var(--text-h1);">8</div>
      <div style="font:var(--text-label);color:var(--fg-3);margin-top:2px;">4 PAX</div>
      <div style="position:absolute;left:14px;bottom:12px;"><span class="filo-pill" style="color:#d8a73a;">Bill</span></div>
      <div style="position:absolute;right:14px;bottom:12px;font:var(--text-num);color:var(--filo-gold);">$164</div>
    </div>
    <!-- available -->
    <div style="position:relative;width:150px;height:118px;background:var(--filo-surface);border-radius:16px;padding:14px;border:0.5px solid var(--border-cream);">
      <div style="font:var(--text-h1);color:var(--fg-2);">5</div>
      <div style="position:absolute;left:14px;bottom:12px;"><span class="filo-pill" style="color:var(--fg-3);">Available</span></div>
    </div>
  </div>
</div></body></html>
