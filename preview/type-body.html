<!-- @dsCard group="Type" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="eyebrow">Body · labels · numbers</div>
  <div style="margin-top:16px;display:flex;flex-direction:column;gap:14px;">
    <div class="row" style="justify-content:space-between;align-items:baseline;">
      <span style="font:var(--text-body);color:var(--fg-2);max-width:62%;">Filo works the way a good shift does — smoothly, intuitively, without getting in the way.</span>
      <span class="mono-tag">Body · 16 / 400</span>
    </div>
    <div class="row" style="justify-content:space-between;align-items:baseline;">
      <span style="font:var(--text-label);color:var(--fg-3);">Average spend · per cover</span>
      <span class="mono-tag">Label · 14 / 400</span>
    </div>
    <div class="row" style="justify-content:space-between;align-items:baseline;">
      <span style="font:var(--text-num-lg);color:var(--filo-gold);">$48.20</span>
      <span class="mono-tag">Number · 22 / 700 · gold = money</span>
    </div>
    <div class="row" style="justify-content:space-between;align-items:baseline;">
      <span class="filo-pill" style="background:var(--filo-surface-3);color:var(--fg-2);padding:5px 9px;border-radius:6px;">GF</span>
      <span class="mono-tag">Pill · 11 / 700 · uppercase tracked</span>
    </div>
  </div>
</div></body></html>
