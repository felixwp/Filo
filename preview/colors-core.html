<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;">
    <div class="col">
      <div style="height:96px;background:#0A0A0A;border:0.5px solid var(--border-cream);border-radius:12px;"></div>
      <div style="margin-top:10px;font-weight:700;font-size:14px;">Base</div>
      <div class="mono-tag">#0A0A0A</div>
      <div class="mono-tag" style="margin-top:2px;color:var(--fg-4)">Background only</div>
    </div>
    <div class="col">
      <div style="height:96px;background:#1C1C1C;border:0.5px solid var(--border-cream);border-radius:12px;"></div>
      <div style="margin-top:10px;font-weight:700;font-size:14px;">Surface</div>
      <div class="mono-tag">#1C1C1C</div>
      <div class="mono-tag" style="margin-top:2px;color:var(--fg-4)">Cards · panels</div>
    </div>
    <div class="col">
      <div style="height:96px;background:#0D4A28;border-radius:12px;"></div>
      <div style="margin-top:10px;font-weight:700;font-size:14px;">Racing green</div>
      <div class="mono-tag">#0D4A28</div>
      <div class="mono-tag" style="margin-top:2px;color:var(--fg-4)">Primary signal</div>
    </div>
    <div class="col">
      <div style="height:96px;background:#C9921E;border-radius:12px;"></div>
      <div style="margin-top:10px;font-weight:700;font-size:14px;">Gold</div>
      <div class="mono-tag">#C9921E</div>
      <div class="mono-tag" style="margin-top:2px;color:var(--fg-4)">Money · rare</div>
    </div>
    <div class="col">
      <div style="height:96px;background:#F5EFE4;border-radius:12px;"></div>
      <div style="margin-top:10px;font-weight:700;font-size:14px;">Warm cream</div>
      <div class="mono-tag">#F5EFE4</div>
      <div class="mono-tag" style="margin-top:2px;color:var(--fg-4)">All text</div>
    </div>
  </div>
</div></body></html>
