<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Reminder card · course-away sidebar</div>
  <div class="col" style="gap:10px;max-width:300px;">
    <div class="row" style="gap:12px;background:var(--filo-surface);border:0.5px solid var(--border-green);border-radius:12px;padding:12px 14px;">
      <i data-lucide="utensils" style="width:20px;height:20px;color:#5cc88a;"></i>
      <div class="col" style="gap:2px;flex:1;">
        <div style="font:var(--text-h3);">Table 12 · mains</div>
        <div style="font:var(--text-label);color:var(--fg-3);">Course away · 4 min</div>
      </div>
      <i data-lucide="chevron-right" style="width:18px;height:18px;color:var(--fg-4);"></i>
    </div>
    <div class="row" style="gap:12px;background:var(--filo-surface);border:0.5px solid var(--border-cream);border-radius:12px;padding:12px 14px;">
      <i data-lucide="wine" style="width:20px;height:20px;color:#d8a73a;"></i>
      <div class="col" style="gap:2px;flex:1;">
        <div style="font:var(--text-h3);">Table 8 · wine</div>
        <div style="font:var(--text-label);color:var(--fg-3);">Pour with starters</div>
      </div>
      <i data-lucide="chevron-right" style="width:18px;height:18px;color:var(--fg-4);"></i>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
