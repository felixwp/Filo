<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:16px;">Table status — colour as a border glow, never a fill</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
    <div class="col" style="align-items:center;gap:10px;">
      <div style="width:100%;height:70px;background:#1C1C1C;border-radius:14px;box-shadow:0 0 0 2.5px #2EA866, 0 0 28px rgba(46,168,102,0.65);"></div>
      <span class="filo-pill" style="color:#5cc88a;font-weight:700;">Occupied</span>
    </div>
    <div class="col" style="align-items:center;gap:10px;">
      <div style="width:100%;height:70px;background:#1C1C1C;border-radius:14px;box-shadow:0 0 0 2.5px #D2661C, 0 0 28px rgba(210,102,28,0.6);"></div>
      <span class="filo-pill" style="color:#e57c33;font-weight:700;">Ordering</span>
    </div>
    <div class="col" style="align-items:center;gap:10px;">
      <div style="width:100%;height:70px;background:#1C1C1C;border-radius:14px;box-shadow:0 0 0 2.5px #ECC04A, 0 0 28px rgba(236,192,74,0.7);"></div>
      <span class="filo-pill" style="color:#ecc04a;font-weight:700;">Awaiting payment</span>
    </div>
    <div class="col" style="align-items:center;gap:10px;">
      <div style="width:100%;height:70px;background:#1C1C1C;border-radius:14px;border:1.5px solid var(--border-cream-2);"></div>
      <span class="filo-pill" style="color:var(--fg-3);font-weight:700;">Available</span>
    </div>
  </div>
</div></body></html>
