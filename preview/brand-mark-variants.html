<!-- @dsCard group="Brand" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:16px;">Mark variants · on dark, on light, reversed</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
    <div class="col" style="align-items:center;gap:10px;background:var(--filo-black);border:0.5px solid var(--border-cream);border-radius:12px;padding:22px 0;">
      <img src="../assets/filo-mark-green.svg" height="66">
      <span class="mono-tag">Primary · on base</span>
    </div>
    <div class="col" style="align-items:center;gap:10px;background:var(--filo-cream);border-radius:12px;padding:22px 0;">
      <img src="../assets/filo-mark-cream.svg" height="66">
      <span class="mono-tag" style="color:rgba(10,10,10,0.5)">Mono · on cream</span>
    </div>
    <div class="col" style="align-items:center;gap:10px;background:var(--filo-green);border-radius:12px;padding:22px 0;">
      <img src="../assets/filo-mark-mono-cream.svg" height="66">
      <span class="mono-tag" style="color:rgba(245,239,228,0.7)">Reversed · on green</span>
    </div>
  </div>
</div></body></html>
